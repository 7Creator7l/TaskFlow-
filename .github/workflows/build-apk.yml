name: Build TaskFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find TaskFlow project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'TaskFlow-Android-AAB*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "TaskFlow Android ZIP not found"
            exit 1
          fi
          echo "Found: $ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project

      - name: Check project
        run: |
          cd project
          ls -la
          test -f settings.gradle
          test -f app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd project
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
