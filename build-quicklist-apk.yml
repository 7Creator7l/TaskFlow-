name: Build QuickList Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find QuickList Android ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'QuickList_Android_Project.zip' | head -n 1)
          if [ -z "$ZIP" ]; then echo "QuickList Android ZIP not found"; exit 1; fi
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Build Release APK
        working-directory: project
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: quicklist-release-apk
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
